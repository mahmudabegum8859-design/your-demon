plugins {
    id 'com.android.application'
}

android {
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
    }
    compileSdk 34
    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
    defaultConfig {
        applicationId "com.opx.yourdemon"
        minSdk 23
        targetSdk 34
        versionCode 13
        versionName "2.2.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("STORE_FILE") ?: "../your-demon.jks")
            storePassword System.getenv("STORE_PASSWORD") ?: "yourdemon123"
            keyAlias System.getenv("KEY_ALIAS") ?: "your-demon"
            keyPassword System.getenv("KEY_PASSWORD") ?: "yourdemon123"
        }
    }

    buildTypes {
        release {
            // minify/shrink are disabled because Core.str() looks up string
            // resources dynamically via getIdentifier(); shrinking would strip
            // those strings and break the UI (e.g. Evil Twin, Captive Portal).
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    implementation 'com.airbnb.android:lottie:4.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.seancfoley:ipaddress:5.3.3'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.facebook.shimmer:shimmer:0.1.0@aar'
    implementation 'jcifs:jcifs:1.3.17'
    implementation 'commons-net:commons-net:3.9.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}