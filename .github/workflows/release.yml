name: Your Demon Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > your-demon.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build signed release APK
      run: ./gradlew assembleRelease
      env:
        STORE_FILE: ${{ github.workspace }}/your-demon.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        name: Your Demon ${{ github.ref_name }}
        body: |
          ## Your Demon ${{ github.ref_name }}
          Automatic build from tag ${{ github.ref_name }}.
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
