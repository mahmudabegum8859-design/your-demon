dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://jcenter.bintray.com' } // jcenter mirror for jcifs
    }
}
rootProject.name = "your-demon"
include ':app'
include ':logviewer'
